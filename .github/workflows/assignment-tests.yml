name: Assignment tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chatgpt/complete-agent-assignment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --all-groups --locked
      - name: Run non-Modal test suite
        run: uv run pytest -q
