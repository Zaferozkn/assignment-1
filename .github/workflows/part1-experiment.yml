name: Part 1 real agent experiment

on:
  push:
    branches:
      - chatgpt/complete-agent-assignment
    paths:
      - .github/workflows/part1-experiment.yml

permissions:
  contents: read

jobs:
  part1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_MODEL: deepseek/deepseek-v4-flash-0731
      OPENAI_MAX_RETRIES: '1'
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_IMAGE_BUILDER_VERSION: '2025.06'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Check credentials without exposing values
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OpenRouter key"; exit 1; }
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo "Missing Modal credentials"; exit 1; }
      - name: Run DeepSeek coding agent with a bounded 45-step budget
        run: |
          uv run assignment-code-agent \
            --task tasks/chess-terminal-move \
            --model deepseek/deepseek-v4-flash-0731 \
            --step-limit 45 \
            --skills-path tasks/code-skills \
            --trajectory artifacts/part1-trajectory.json \
            --patch-output artifacts/fix.patch
      - name: Evaluate generated patch on fresh sandbox
        if: success()
        run: make check-part1
      - name: Upload real evidence even on failed run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part1-real-run
          path: |
            artifacts/part1-trajectory.json
            artifacts/fix.patch
          if-no-files-found: warn
          retention-days: 30
